services:
  electro-proxy:
    container_name: electro-proxy
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - electro-fe
      - electro-be
    ports:
      - 3001:80
    networks:
      - frontend
      - backend

  electro-fe:
    container_name: electro-fe
    image: electro-fe
    restart: always
    depends_on:
      - electro-be
    build:
      context: electro-fe
      dockerfile: Dockerfile
    networks:
      - frontend

  electro-be:
    container_name: electro-be
    image: electro-be
    restart: on-failure
    depends_on:
      electro-db:
        condition: service_healthy
    build:
      context: electro-be
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://electro-db:3306/electro
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMAIL: ${EMAIL}
      PASSWORK_EMAIL: ${PASSWORK_EMAIL}
      JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      GHN_TOKEN: ${GHN_TOKEN}
    networks:
      - frontend
      - backend

  electro-db:
    container_name: electro-db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - 3308:3306
    networks:
      - backend
    volumes:
      - electro-mysql-data:/var/lib/mysql
    command: --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  electro-mysql-data:

networks:
  frontend:
  backend:
