server {
    listen 80;
    listen [::]:80;

    location / {
        proxy_pass http://electro-fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://electro-be:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /client-api/ {
        proxy_pass http://electro-be:8080/client-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}